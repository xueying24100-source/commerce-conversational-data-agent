name: Commerce Live Model Evaluation

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-live-model-evaluation
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secret.outputs.configured }}
    steps:
      - id: secret
        name: Require live-model credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::DEEPSEEK_API_KEY is required for live Commerce E2E."
            exit 1
          fi
          echo "::warning::Scheduled live Commerce E2E skipped because DEEPSEEK_API_KEY is absent."

  evaluate:
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce_e2e
          POSTGRES_USER: commerce_test_admin
          POSTGRES_PASSWORD: commerce_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_test_admin -d commerce_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      COMMERCE_LIVE_E2E_DATABASE_URL: postgresql://commerce_test_admin:commerce_test_password@127.0.0.1:5432/commerce_e2e
      COMMERCE_LIVE_E2E_CONFIRM: commerce-live-e2e
      COMMERCE_LIVE_E2E_MODEL: deepseek-v4-flash
      COMMERCE_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate release assets
        run: npm run check:release-assets
      - name: Build production Web and Worker artifacts
        run: npm run build
      - name: Run live Commerce E2E
        run: npm run test:e2e:commerce:live
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commerce-live-e2e-${{ github.run_id }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: tmp/commerce-live-e2e/
