name: Commerce Release Evidence Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: true
      COMMERCE_REAL_MODEL_EVAL_ENDPOINT:
        required: true
      COMMERCE_REAL_MODEL_EVAL_TOKEN:
        required: true
      COMMERCE_FINAL_CONTROLLER_EVAL_ENDPOINT:
        required: true
      COMMERCE_FINAL_CONTROLLER_EVAL_TOKEN:
        required: true
      COMMERCE_RELEASE_SMOKE_CONTROL_DATABASE_URL:
        required: true
      COMMERCE_RELEASE_SMOKE_WORKER_DATABASE_URL:
        required: true
      COMMERCE_RELEASE_SMOKE_ANALYTICS_DATABASE_URL:
        required: true
      COMMERCE_RELEASE_SMOKE_TENANT_ID:
        required: true
      COMMERCE_RELEASE_SMOKE_QUESTION:
        required: true
      COMMERCE_RELEASE_SMOKE_EXPECTED_METRIC:
        required: true
      COMMERCE_RELEASE_SMOKE_EXPECTED_VALUE:
        required: true
      COMMERCE_RELEASE_SMOKE_EXPECTED_UNIT:
        required: true
      COMMERCE_RELEASE_SMOKE_PG_CA:
        required: false
      COMMERCE_CONTROL_API_DATABASE_URL:
        required: false
      COMMERCE_CONTROL_WORKER_DATABASE_URL:
        required: false
      COMMERCE_ANALYTICS_DATABASE_URL:
        required: false
      COMMERCE_ANALYTICS_INGEST_DATABASE_URL:
        required: false
      COMMERCE_CONTROL_MAINTENANCE_DATABASE_URL:
        required: false
      COMMERCE_CONTROL_MIGRATION_DATABASE_URL:
        required: false
      COMMERCE_ANALYTICS_MIGRATION_DATABASE_URL:
        required: false
      COMMERCE_CONTROL_BACKUP_DATABASE_URL:
        required: false
      COMMERCE_ANALYTICS_BACKUP_DATABASE_URL:
        required: false
      COMMERCE_CONTROL_RESTORE_DRILL_DATABASE_URL:
        required: false
      COMMERCE_ANALYTICS_RESTORE_DRILL_DATABASE_URL:
        required: false
      COMMERCE_RESTORE_DRILL_TARGET_MARKER:
        required: false
      COMMERCE_PERFORMANCE_EVIDENCE_URL:
        required: false
      COMMERCE_PERFORMANCE_EVIDENCE_SHA256:
        required: false
      COMMERCE_FEISHU_SANDBOX_EVIDENCE_URL:
        required: false
      COMMERCE_FEISHU_SANDBOX_EVIDENCE_SHA256:
        required: false
      COMMERCE_USABILITY_EVIDENCE_URL:
        required: false
      COMMERCE_USABILITY_EVIDENCE_SHA256:
        required: false

permissions:
  contents: read

concurrency:
  group: commerce-release-evidence-production-fixture
  cancel-in-progress: false

jobs:
  evidence:
    environment: commerce-production-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce_release
          POSTGRES_USER: commerce_test_admin
          POSTGRES_PASSWORD: commerce_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_test_admin -d commerce_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      COMMERCE_TEST_DATABASE_URL: postgresql://commerce_test_admin:commerce_test_password@127.0.0.1:5432/commerce_release
      COMMERCE_TEST_DATABASE_CONFIRM: commerce-integration
      COMMERCE_LIVE_E2E_DATABASE_URL: postgresql://commerce_test_admin:commerce_test_password@127.0.0.1:5432/commerce_release
      COMMERCE_LIVE_E2E_CONFIRM: commerce-live-e2e
      COMMERCE_LIVE_E2E_MODEL: deepseek-v4-flash
      COMMERCE_REAL_MODEL_EVAL_ENDPOINT: ${{ secrets.COMMERCE_REAL_MODEL_EVAL_ENDPOINT }}
      COMMERCE_REAL_MODEL_EVAL_TOKEN: ${{ secrets.COMMERCE_REAL_MODEL_EVAL_TOKEN }}
      COMMERCE_REAL_MODEL_EVAL_MODEL: deepseek-v4-flash
      COMMERCE_FINAL_CONTROLLER_EVAL_ENDPOINT: ${{ secrets.COMMERCE_FINAL_CONTROLLER_EVAL_ENDPOINT }}
      COMMERCE_FINAL_CONTROLLER_EVAL_TOKEN: ${{ secrets.COMMERCE_FINAL_CONTROLLER_EVAL_TOKEN }}
      COMMERCE_RELEASE_REVISION: ${{ github.sha }}
      COMMERCE_PERFORMANCE_EVIDENCE_URL: ${{ secrets.COMMERCE_PERFORMANCE_EVIDENCE_URL }}
      COMMERCE_PERFORMANCE_EVIDENCE_SHA256: ${{ secrets.COMMERCE_PERFORMANCE_EVIDENCE_SHA256 }}
      COMMERCE_FEISHU_SANDBOX_EVIDENCE_URL: ${{ secrets.COMMERCE_FEISHU_SANDBOX_EVIDENCE_URL }}
      COMMERCE_FEISHU_SANDBOX_EVIDENCE_SHA256: ${{ secrets.COMMERCE_FEISHU_SANDBOX_EVIDENCE_SHA256 }}
      COMMERCE_USABILITY_EVIDENCE_URL: ${{ secrets.COMMERCE_USABILITY_EVIDENCE_URL }}
      COMMERCE_USABILITY_EVIDENCE_SHA256: ${{ secrets.COMMERCE_USABILITY_EVIDENCE_SHA256 }}
      COMMERCE_RESTORE_DRILL_TARGET_MARKER: ${{ secrets.COMMERCE_RESTORE_DRILL_TARGET_MARKER }}
      COMMERCE_RELEASE_SMOKE_CONFIRM: commerce-final-image-smoke
      COMMERCE_RELEASE_SMOKE_CONTROL_DATABASE_URL: ${{ secrets.COMMERCE_RELEASE_SMOKE_CONTROL_DATABASE_URL }}
      COMMERCE_RELEASE_SMOKE_WORKER_DATABASE_URL: ${{ secrets.COMMERCE_RELEASE_SMOKE_WORKER_DATABASE_URL }}
      COMMERCE_RELEASE_SMOKE_ANALYTICS_DATABASE_URL: ${{ secrets.COMMERCE_RELEASE_SMOKE_ANALYTICS_DATABASE_URL }}
      COMMERCE_RELEASE_SMOKE_TENANT_ID: ${{ secrets.COMMERCE_RELEASE_SMOKE_TENANT_ID }}
      COMMERCE_RELEASE_SMOKE_QUESTION: ${{ secrets.COMMERCE_RELEASE_SMOKE_QUESTION }}
      COMMERCE_RELEASE_SMOKE_EXPECTED_METRIC: ${{ secrets.COMMERCE_RELEASE_SMOKE_EXPECTED_METRIC }}
      COMMERCE_RELEASE_SMOKE_EXPECTED_VALUE: ${{ secrets.COMMERCE_RELEASE_SMOKE_EXPECTED_VALUE }}
      COMMERCE_RELEASE_SMOKE_EXPECTED_UNIT: ${{ secrets.COMMERCE_RELEASE_SMOKE_EXPECTED_UNIT }}
      COMMERCE_RELEASE_SMOKE_MODEL: deepseek-v4-flash
      COMMERCE_PG_SSL: '1'
      COMMERCE_PG_REJECT_UNAUTHORIZED: '1'
      COMMERCE_PG_CA: ${{ secrets.COMMERCE_RELEASE_SMOKE_PG_CA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/e2e/requirements-browser-e2e.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/e2e/requirements-browser-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Require release credential
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is required; release evidence cannot be skipped."
            exit 1
          fi
      - name: Run complete release evidence gate
        env:
          COMMERCE_CONTROL_API_DATABASE_URL: ${{ secrets.COMMERCE_CONTROL_API_DATABASE_URL }}
          COMMERCE_CONTROL_WORKER_DATABASE_URL: ${{ secrets.COMMERCE_CONTROL_WORKER_DATABASE_URL }}
          COMMERCE_ANALYTICS_DATABASE_URL: ${{ secrets.COMMERCE_ANALYTICS_DATABASE_URL }}
          COMMERCE_ANALYTICS_INGEST_DATABASE_URL: ${{ secrets.COMMERCE_ANALYTICS_INGEST_DATABASE_URL }}
          COMMERCE_CONTROL_MAINTENANCE_DATABASE_URL: ${{ secrets.COMMERCE_CONTROL_MAINTENANCE_DATABASE_URL }}
          COMMERCE_CONTROL_MIGRATION_DATABASE_URL: ${{ secrets.COMMERCE_CONTROL_MIGRATION_DATABASE_URL }}
          COMMERCE_ANALYTICS_MIGRATION_DATABASE_URL: ${{ secrets.COMMERCE_ANALYTICS_MIGRATION_DATABASE_URL }}
          COMMERCE_CONTROL_BACKUP_DATABASE_URL: ${{ secrets.COMMERCE_CONTROL_BACKUP_DATABASE_URL }}
          COMMERCE_ANALYTICS_BACKUP_DATABASE_URL: ${{ secrets.COMMERCE_ANALYTICS_BACKUP_DATABASE_URL }}
          COMMERCE_CONTROL_RESTORE_DRILL_DATABASE_URL: ${{ secrets.COMMERCE_CONTROL_RESTORE_DRILL_DATABASE_URL }}
          COMMERCE_ANALYTICS_RESTORE_DRILL_DATABASE_URL: ${{ secrets.COMMERCE_ANALYTICS_RESTORE_DRILL_DATABASE_URL }}
        run: npm run release:check:evidence
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commerce-release-evidence-${{ github.run_id }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            tmp/commerce-release/
            tmp/commerce-live-e2e/
            tmp/commerce-real-model-eval/
            tmp/commerce-final-controller-eval/
            tmp/commerce-browser-e2e/
