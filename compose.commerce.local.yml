name: commerce-data-agent-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_agent
      POSTGRES_USER: commerce_app
      POSTGRES_PASSWORD: commerce_local_password
    ports:
      - "127.0.0.1:35433:5432"
    volumes:
      - commerce_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_app -d commerce_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  commerce_agent_postgres:

